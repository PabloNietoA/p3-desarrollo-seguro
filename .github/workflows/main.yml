name: DevSecOps Pipeline

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:

  # 📥 Preparación
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

  
  smoke-test:
    name: Validar arranque
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      
      - name: Check Runtime
        run: timeout 5s python main.py || [ $? -eq 124 ]
  # 🔍 SAST
  sast:
    name: Análisis estático (SAST)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Semgrep
        run: pip install semgrep

      - name: Ejecutar SAST
        run: semgrep --config=auto --severity ERROR --error
      
  # 🛡️ SCA (Software Composition Analysis)
  sca:
    name: Análisis de dependencias (SCA)
    runs-on: ubuntu-latest
    needs: setup
    steps: 
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar pip-audit
        run: pip install pip-audit

      - name: Ejecutar SCA con pip-audit
        run: pip-audit -r requirements.txt


  deploy:
    name: Despliegue a producción
    runs-on: ubuntu-latest
    needs: [sca, smoke-test]
    steps:
      - uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          wait_deploy: true

  
  

  # 🕷️ DAST (Dynamic Application Security Testing)
  dast:
    name: Análisis dinámico (DAST)
    runs-on: ubuntu-latest
    needs: deploy 
    permissions:
      issues: write
      contents: read


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ejecutar Análisis DAST con OWASP ZAP (Baseline)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://p3-desarrollo-seguro.onrender.com'
          fail_action: true

