name: CI/CD Security Pipeline (Flask)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-security:
    name: Seguridad y Construcción Flask
    runs-on: ubuntu-latest

    steps:
      # 1. Descargue el código del repositorio
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      # 2. Prepare el entorno (Python)
      - name: 🐍 Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Instale dependencias desde readme.txt
      # Filtramos el archivo para que pip no falle con texto que no sean paquetes
      - name: 📦 Instalar dependencias (desde readme.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "Dependencias cargadas"

      # 4. Ejecute el análisis SAST (Semgrep)
      # Escanea el código fuente buscando fallos de lógica de seguridad.
      - name: 🔍 Análisis SAST (Semgrep)
        uses: semgrep/action@v1
        with:
          config: "p/python" # Reglas específicas para Python y Flask
        # Los hallazgos aparecerán detallados en los logs del pipeline.

      # 5. Ejecute el análisis SCA (Trivy)
      # Busca vulnerabilidades (CVEs) en las librerías de Flask instaladas.
      - name: 🛡️ Análisis SCA (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'      # 6 y 7. Genera una tabla legible en los logs
          exit-code: '0'       # Cambiar a '1' para bloquear el pipeline si hay riesgos críticos
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      # 8. Reporte final de resumen (Opcional pero recomendado)
      - name: 📝 Resumen del Pipeline
        if: always()
        run: |
          echo "### Resultado del análisis de seguridad" >> $GITHUB_STEP_SUMMARY
          echo "✅ Pipeline completado. Revisa los logs de 'Semgrep' y 'Trivy' para ver detalles." >> $GITHUB_STEP_SUMMARY
