name: DevSecOps Pipeline

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:

  # 📥 Preparación
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

  # 🔍 SAST
  sast:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Semgrep
        run: pip install semgrep

      - name: Ejecutar SAST
        run: semgrep --config=auto --severity ERROR --error

      # - name: Subir reporte SAST
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: semgrep-report
      #     path: semgrep-report.json
      
  # 🛡️ SCA (Software Composition Analysis)
  sca:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar pip-audit
        run: pip install pip-audit

      - name: Ejecutar SCA con pip-audit
        run: pip-audit -r requirements.txt
        
  # 🔑 Secret Scanning
  secret-scan:
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - uses: actions/checkout@v4

      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@v2

  # 🕷️ DAST (Dynamic Application Security Testing)
  dast:
    runs-on: ubuntu-latest
    needs: [setup] # [sast, sca, secret-scan] 
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t dast-build .

      - name: Desplegar aplicación en Docker local
        run: docker run -d -p 5000:5000 --name dast-container dast-build

      - name: Esperar a que la aplicación inicie
        run: |
          echo "Esperando a que la aplicación esté disponible..."
          sleep 15 

      - name: Ejecutar Análisis DAST con OWASP ZAP (Baseline)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:5000'
          fail_action: true
          # Genera un reporte como issue
          token: ${{ secrets.GITHUB_TOKEN }}
          issue_title: 'Reporte de Vulnerabilidades DAST (ZAP)'
