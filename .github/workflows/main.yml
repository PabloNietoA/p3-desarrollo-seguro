name: DevSecOps Pipeline

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:

  # PREPARACION
  setup:
    name: Preparación
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

  # ARRANQUE DE PRUEBA
  smoke-test:
    name: Validar arranque
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      
      - name: Check Runtime
        run: timeout 5s python main.py || [ $? -eq 124 ]
  
  
  # ANALISIS SAST
  sast:
    name: Análisis estático (SAST)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v6

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Instalar Semgrep
        run: pip install semgrep

      - name: Ejecutar SAST
        run: semgrep scan --config="p/default" --json-output semgrep-results.json

      - name: Analizar resultados y aplicar lógica de bloqueo
        run: |
          if [ ! -f semgrep-results.json ]; then
            echo "::error::No se encontró el archivo de resultados de Semgrep."
            exit 1
          fi

          BLOCKING_FINDINGS=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' semgrep-results.json)
          OTHER_FINDINGS=$(jq '[.results[] | select(.extra.severity != "ERROR")] | length' semgrep-results.json)
          
          echo "# 🛡️ Reporte de Seguridad de Semgrep" >> $GITHUB_STEP_SUMMARY
          
          if [ "$BLOCKING_FINDINGS" -gt 0 ]; then
            echo "### ❌ Estado: Fallido ($BLOCKING_FINDINGS errores críticos)" >> $GITHUB_STEP_SUMMARY
            echo "Se han detectado los siguientes hallazgos que bloquean el pipeline:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            echo "| Archivo y Línea | ID de la Regla | Mensaje |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            
            jq -r '.results[] | select(.extra.severity == "ERROR") | "| `\(.path):\(.start.line)` | **\(.check_id)** | \(.extra.message) |"' semgrep-results.json >> $GITHUB_STEP_SUMMARY
            
            if [ "$OTHER_FINDINGS" -gt 0 ]; then

              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Otros Hallazgos:" >> $GITHUB_STEP_SUMMARY
              
              echo "| Severidad | Archivo y Línea | CWE | Mensaje | Probabilidad | Impacto | Confianza |" >> $GITHUB_STEP_SUMMARY
              echo "| :--- | :--- | :--- | :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
              
              jq -r '.results[] | select(.extra.severity != "ERROR") | "| **\(.extra.severity)** | `\(.path):\(.start.line)` | \(.extra.metadata.cwe) | \(.extra.message) | \(.extra.metadata.likelihood) | \(.extra.metadata.impact) | **\(.extra.metadata.confidence)** |"' semgrep-results.json >> $GITHUB_STEP_SUMMARY
            fi  

            exit 1
          else
            if [ "$OTHER_FINDINGS" -gt 0 ]; then

              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Otros Hallazgos:" >> $GITHUB_STEP_SUMMARY
              
              echo "| Severidad | Archivo y Línea | CWE | Mensaje | Probabilidad | Impacto | Confianza |" >> $GITHUB_STEP_SUMMARY
              echo "| :--- | :--- | :--- | :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
              
              jq -r '.results[] | select(.extra.severity != "ERROR") | "| **\(.extra.severity)** | `\(.path):\(.start.line)` | \(.extra.metadata.cwe) | \(.extra.message) | \(.extra.metadata.likelihood) | \(.extra.metadata.impact) | **\(.extra.metadata.confidence)** |"' semgrep-results.json >> $GITHUB_STEP_SUMMARY
            fi 

            exit 0
          fi

      - name: Guardar JSON como Artefacto descargable
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-findings
          path: semgrep-results.json
          retention-days: 14
      
  # ANALISIS SCA
  sca:
    name: Análisis de dependencias (SCA)
    runs-on: ubuntu-latest
    needs: setup
    steps: 
      - name: Checkout
        uses: actions/checkout@v6

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Instalar pip-audit
        run: pip install pip-audit

      - name: Ejecutar SCA con pip-audit
        run: pip-audit -r requirements.txt

  # DEPLOYMENT A RENDER
  deploy:
    name: Despliegue a producción
    runs-on: ubuntu-latest
    needs: [sast, sca, smoke-test]
    steps:
      - uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          wait_deploy: true

  # ESCANEO DE SECRETOS
  secret-scan:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - uses: actions/checkout@v6

      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
  
  # ANALISIS DAST
  dast:
    name: Análisis dinámico (DAST)
    runs-on: ubuntu-latest
    needs: deploy 
    permissions:
      issues: write
      contents: read


    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ejecutar OWASP ZAP
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://p3-desarrollo-seguro.onrender.com'
          fail_action: false
      
      - name: Publicar Resumen de ZAP en el Pipeline
        if: always()
        run: |
          if [ -f report_md.md ]; then
            # Añadimos un título personalizado
            echo "## 🕸️ Reporte de Seguridad Dinámica (OWASP ZAP)" >> $GITHUB_STEP_SUMMARY
            
            # Volcamos todo el contenido del archivo Markdown generado por ZAP
            cat report_md.md >> $GITHUB_STEP_SUMMARY
            
            # Opcional: Lógica para fallar el pipeline si hubo alertas de alto nivel.
            # ZAP Baseline usa códigos de salida específicos (1 para fallos de script, 2 para alertas de seguridad)
            # pero como usamos fail_action: false, verificamos si el archivo contiene la palabra "High" o "Critical"
            if grep -q "High" report_md.md || grep -q "Critical" report_md.md; then
              echo "::error::ZAP encontró vulnerabilidades Altas o Críticas."
              exit 1
            fi
          else
            echo "### ⚠️ Advertencia" >> $GITHUB_STEP_SUMMARY
            echo "El archivo \`report_md.md\` no se generó." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

